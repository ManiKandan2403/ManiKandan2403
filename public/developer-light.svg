<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8" />
    </linearGradient>
    
    <!-- Filter for subtle drop shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Card Canvas -->
  <rect x="10" y="10" width="780" height="400" rx="20" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)" />

  <!-- Subtle Geometric Grid / Accents in background -->
  <g opacity="0.4">
    <circle cx="120" cy="80" r="40" fill="#DBEAFE" />
    <circle cx="700" cy="100" r="60" fill="#EDE9FE" />
    <circle cx="680" cy="330" r="30" fill="#E0E7FF" />
    <path d="M 60 280 L 100 240 L 140 280" fill="none" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
    <path d="M 640 60 L 670 40 L 700 60" fill="none" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Left Side: Floating Code Windows & Stack Chips -->
  <!-- Floating Window 1 -->
  <g transform="translate(60, 110)" filter="url(#softShadow)">
    <rect width="210" height="130" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <!-- Window Header -->
    <rect width="210" height="28" rx="10" fill="#F1F5F9" />
    <circle cx="16" cy="14" r="4" fill="#EF4444" />
    <circle cx="28" cy="14" r="4" fill="#F59E0B" />
    <circle cx="40" cy="14" r="4" fill="#10B981" />
    <text x="60" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B" font-weight="600">developer.tsx</text>
    
    <!-- Code Lines -->
    <rect x="16" y="42" width="60" height="6" rx="3" fill="#7C3AED" />
    <rect x="82" y="42" width="50" height="6" rx="3" fill="#2563EB" />
    <rect x="28" y="58" width="90" height="6" rx="3" fill="#0EA5E9" />
    <rect x="28" y="74" width="120" height="6" rx="3" fill="#64748B" />
    <rect x="40" y="90" width="70" height="6" rx="3" fill="#10B981" />
    <rect x="16" y="106" width="30" height="6" rx="3" fill="#7C3AED" />
  </g>

  <!-- Floating Tech Badge 1 -->
  <g transform="translate(50, 265)">
    <rect width="110" height="34" rx="17" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#softShadow)" />
    <circle cx="20" cy="17" r="8" fill="#2563EB" />
    <text x="36" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#1E293B">React.js</text>
  </g>

  <!-- Floating Tech Badge 2 -->
  <g transform="translate(180, 255)">
    <rect width="120" height="34" rx="17" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#softShadow)" />
    <circle cx="20" cy="17" r="8" fill="#7C3AED" />
    <text x="36" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#1E293B">TypeScript</text>
  </g>

  <!-- Center-Right: Workstation & Developer Desk -->
  <g id="workstation" transform="translate(320, 60)">
    <!-- Desk Shadow -->
    <ellipse cx="200" cy="310" rx="190" ry="14" fill="#CBD5E1" opacity="0.6" />

    <!-- Modern Desk Surface -->
    <rect x="20" y="280" width="360" height="12" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="40" y="292" width="12" height="40" rx="3" fill="#94A3B8" />
    <rect x="350" y="292" width="12" height="40" rx="3" fill="#94A3B8" />

    <!-- Desk Plant -->
    <g transform="translate(45, 220)">
      <!-- Pot -->
      <polygon points="12,40 28,40 25,60 15,60" fill="#F87171" />
      <!-- Leaves -->
      <path d="M 20 40 Q 8 20 18 10 Q 22 25 20 40" fill="#10B981" />
      <path d="M 20 40 Q 32 20 22 10 Q 18 25 20 40" fill="#059669" />
      <path d="M 20 40 Q 20 5 28 8 Q 24 25 20 40" fill="#34D399" />
    </g>

    <!-- Coffee Mug with Blue Heart -->
    <g transform="translate(325, 250)">
      <rect x="0" y="8" width="18" height="22" rx="3" fill="#2563EB" />
      <path d="M 18 12 C 24 12 24 24 18 24" fill="none" stroke="#2563EB" stroke-width="3" />
      <circle cx="9" cy="18" r="3" fill="#FFFFFF" />
    </g>

    <!-- Big Monitor Setup -->
    <g transform="translate(90, 80)">
      <!-- Monitor Stand -->
      <rect x="100" y="160" width="20" height="42" rx="2" fill="#64748B" />
      <ellipse cx="110" cy="202" rx="35" ry="6" fill="#475569" />
      
      <!-- Monitor Frame -->
      <rect x="0" y="0" width="220" height="160" rx="10" fill="#1E293B" stroke="#334155" stroke-width="3" filter="url(#softShadow)" />
      <!-- Display Area -->
      <rect x="6" y="6" width="208" height="142" rx="6" fill="url(#screenGrad)" />
      
      <!-- Screen Top Bar -->
      <rect x="6" y="6" width="208" height="18" fill="#0F172A" />
      <circle cx="16" cy="15" r="3" fill="#EF4444" />
      <circle cx="24" cy="15" r="3" fill="#F59E0B" />
      <circle cx="32" cy="15" r="3" fill="#10B981" />
      <text x="45" y="18" font-family="monospace" font-size="9" fill="#94A3B8">bash - code</text>

      <!-- Code on Screen (Glowing syntax colors) -->
      <g transform="translate(16, 32)">
        <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">const</text>
        <text x="35" y="12" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F8FAFC">dev</text>
        <text x="60" y="12" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C084FC">=</text>
        <text x="72" y="12" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4ADE80">"ManiKandan"</text>
        
        <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C084FC">async function</text>
        <text x="85" y="28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#60A5FA">buildUI()</text>
        <text x="140" y="28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F8FAFC">{</text>

        <rect x="12" y="36" width="90" height="5" rx="2" fill="#A78BFA" opacity="0.8" />
        <rect x="12" y="46" width="130" height="5" rx="2" fill="#38BDF8" opacity="0.8" />
        <rect x="12" y="56" width="70" height="5" rx="2" fill="#34D399" opacity="0.8" />
        <rect x="12" y="66" width="110" height="5" rx="2" fill="#F472B6" opacity="0.8" />
        
        <text x="0" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F8FAFC">}</text>
        <!-- Blinking cursor -->
        <rect x="12" y="80" width="6" height="12" fill="#38BDF8" />
      </g>
    </g>

    <!-- Laptop to the right -->
    <g transform="translate(240, 180)">
      <!-- Laptop screen -->
      <polygon points="10,0 80,0 75,65 15,65" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <polygon points="14,4 76,4 72,61 18,61" fill="#2563EB" opacity="0.9" />
      <!-- Base -->
      <polygon points="0,65 90,65 82,72 8,72" fill="#94A3B8" />
    </g>

    <!-- Ergonomic Chair Back (Stylized) -->
    <rect x="155" y="160" width="70" height="95" rx="16" fill="url(#purpleGrad)" opacity="0.95" />
    <rect x="180" y="255" width="20" height="35" rx="4" fill="#475569" />
  </g>

  <!-- Floating Sparkles and Achievement Badges -->
  <g transform="translate(710, 200)" filter="url(#softShadow)">
    <circle cx="20" cy="20" r="22" fill="#FFFFFF" stroke="#FBBF24" stroke-width="2" />
    <text x="12" y="26" font-size="18">⭐</text>
  </g>
  <g transform="translate(640, 250)" filter="url(#softShadow)">
    <circle cx="18" cy="18" r="18" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2" />
    <text x="10" y="24" font-size="16">🚀</text>
  </g>
</svg>
